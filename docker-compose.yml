      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # 08 — Insight Service (Audit, Analytics)  →  http://localhost:8008
  # ---------------------------------------------------------------------------
  insight:
    build:
      context: ./src/v1/08_insight
    ports:
      - "8008:8000"
    env_file: ./src/v1/08_insight/.env
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # 09 — Assets Service  →  http://localhost:8009
  # ---------------------------------------------------------------------------
  assets:
    build:
      context: ./src/v1/09_assets
    ports:
      - "8009:8000"
    env_file: ./src/v1/09_assets/.env
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
