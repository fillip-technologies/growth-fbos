services:

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 00 — Gateway Service  →  http://localhost:8000
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: ./src/v1/00_gateway
    ports:
      - "8000:8000"
    env_file: ./src/v1/00_gateway/.env
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # 01 — Identity Service  →  http://localhost:8001
  # ---------------------------------------------------------------------------
  identity:
    build:
      context: ./src/v1/01_identity
    ports:
      - "8001:8000"
    env_file: ./src/v1/01_identity/.env
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # 02 — Revenue Service (Commercial/CRM + Billing)  →  http://localhost:8002
  # ---------------------------------------------------------------------------
  revenue:
    build:
      context: ./src/v1/02_revenue
    ports:
      - "8002:8000"
    env_file: ./src/v1/02_revenue/.env
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # 03 — Delivery Service (Work units, Workflow, Tasks)  →  http://localhost:8003
  # ---------------------------------------------------------------------------
  delivery:
    build:
      context: ./src/v1/03_delivery
    ports:
      - "8003:8000"
    env_file: ./src/v1/03_delivery/.env
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # 04 — Control Service (Approvals, SLA)  →  http://localhost:8004
  # ---------------------------------------------------------------------------
  control:
    build:
      context: ./src/v1/04_control
    ports:
      - "8004:8000"
    env_file: ./src/v1/04_control/.env
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # 05 — Documents Service  →  http://localhost:8005
  # ---------------------------------------------------------------------------
  documents:
    build:
      context: ./src/v1/05_documents
    ports:
      - "8005:8000"
    env_file: ./src/v1/05_documents/.env
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # 06 — Communication Service (Notifications, inbox, webhooks)  →  http://localhost:8006
  # ---------------------------------------------------------------------------
  communication:
    build:
      context: ./src/v1/06_communication
    ports:
      - "8006:8000"
    env_file: ./src/v1/06_communication/.env
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # 07 — Management Service (Planning, Performance/KPIs, Resources)  →  http://localhost:8007
  # ---------------------------------------------------------------------------
  management:
    build:
      context: ./src/v1/07_management
    ports:
      - "8007:8000"
    env_file: ./src/v1/07_management/.env
