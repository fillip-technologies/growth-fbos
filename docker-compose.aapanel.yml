# aaPanel server override — used by scripts/deploy_aapanel.sh:
#   docker compose -f docker-compose.yml -f docker-compose.aapanel.yml up -d --build
#
# Databases live on Hostinger (set in each service .env), so the local MySQL container is
# off (start it with --profile local-db). Only the gateway is published, on localhost:
# aaPanel nginx proxies /api to it. Port 8000 on that host is taken, hence 8100.
#
# Links in identity's emails (invitation, password reset, sign in) point at the public site;
# `environment` wins over the server's untracked .env, so they never fall back to localhost.
name: fbos
services:
  db:            { restart: always, ports: !reset [], profiles: ["local-db"] }
  redis:         { restart: always }
  gateway:
    restart: always
    ports: !override ["127.0.0.1:8100:8000"]
    # /api/inventory/* is the Fixly backend (Node, hosted separately), not a container here.
    environment:
      INVENTORY_SERVICE_URL: https://fixly-backend.fillipsoftware.com
  identity:
    restart: always
    ports: !reset []
    depends_on: !override { redis: { condition: service_started } }
    environment:
      CLIENT_ADMIN_BASE_URL: https://fbos.fillipsoftware.com
  revenue:       { restart: always, ports: !reset [], depends_on: !reset {} }
  delivery:
    restart: always
    ports: !reset []
    depends_on: !reset {}
    # Only the live server runs delivery's worker (every environment shares the database):
    # it sends task notifications from the outbox to communication every 30 s.
    environment:
      COMMUNICATION_SERVICE_URL: http://communication:8000
      REVENUE_SERVICE_URL: http://revenue:8000
      WORKER_INTERVAL_SECONDS: "30"
  control:       { restart: always, ports: !reset [], depends_on: !reset {} }
  documents:
    restart: always
    ports: !reset []
    depends_on: !reset {}
    # Records documents attach to: revenue's (in this compose) and inventory's (the Fixly backend).
    environment:
      SUBJECT_SERVICES: '{"revenue": "http://revenue:8000/api/revenue/v1", "delivery": "http://delivery:8000/api/delivery/v1", "inventory": "https://fixly-backend.fillipsoftware.com/api/inventory/v1"}'
  communication: { restart: always, ports: !reset [], depends_on: !reset {} }
  management:    { restart: always, ports: !reset [], depends_on: !reset {} }
  insight:       { restart: always, ports: !reset [], depends_on: !reset {} }
  assets:        { restart: always, ports: !reset [], depends_on: !reset {} }
  people:        { restart: always, ports: !reset [], depends_on: !reset {} }
