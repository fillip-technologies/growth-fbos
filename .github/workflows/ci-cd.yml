# On every push to main: tests each service, then deploys to the aaPanel server if they pass.
# Setup (secrets, deploy key): DEPLOY_AAPANEL.md.
name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [01_identity, 02_revenue, 03_delivery, 04_control, 05_documents, 06_communication]
    defaults:
      run:
        working-directory: src/v1/${{ matrix.service }}
    env:
      # No .env in CI. Engines are created at import, so the URL must parse (and take pool
      # options); it is never connected to: the tests swap in their own SQLite database.
      DATABASE_URL: mysql+aiomysql://ci:ci@127.0.0.1:3306/ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/v1/${{ matrix.service }}/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  deploy:
    name: Deploy to aaPanel
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://fbos.fillipsoftware.com
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::Deploy secrets are not set (see DEPLOY_AAPANEL.md)"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          # The key's forced command on the server picks the checkout from this word.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "${DEPLOY_USER:-root}@$DEPLOY_HOST" backend
